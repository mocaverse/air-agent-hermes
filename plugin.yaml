name: air-agent-kya
version: 0.1.0
manifest_version: 2
api_version: 1
description: >
  AIR Agent KYA: lets Hermes prove who it acts for. The user delegates their AIR identity
  (Moca Network) to the agent once in the AIR Console; the agent then enters Know-Your-Agent
  stores with a one-time SD-JWT presentation from AIR that discloses only the claims the store
  asks for, and gets the catalog that credential unlocks. Identity only, no wallet signing.
author: MocaNetwork
license: MIT
homepage: https://github.com/MocaNetwork/air-agent-hermes
tags: [identity, kya, know-your-agent, air, moca, credentials, sd-jwt]
requires_hermes: ">=0.23.0"

provides_tools:
  - air_whoami
  - kya_visit
provides_hooks:
  - pre_tool_call

python_dependencies:
  - "httpx>=0.27,<1"
  - "httpcore>=1,<2"
  - "cryptography>=42,<47"

# All optional. Empty endpoint settings use the AIR sandbox defaults from agent/air.ts.
config_schema:
  require_approval:
    type: bool
    default: true
    label: "Ask before disclosing credentials"
    description: "Each live kya_visit asks you before AIR presents your claims to a site."
  allow_local_sites:
    type: bool
    default: false
    label: "Allow localhost sites"
    description: "Let kya_visit reach sites on localhost (http or https) outside mock mode. Private and link-local addresses stay blocked."
  partner_id:
    type: str
    default: ""
    label: "AIR partner ID"
    description: "Partner for agent sessions when the delegation has none. Empty: AIR AI Studio sandbox partner."
  console_url:
    type: str
    default: ""
    label: "AIR Console URL"
    description: "Where `hermes air login` sends you to approve. Empty: https://sandbox.agents.air3.com"
  api_url:
    type: str
    default: ""
    label: "AIR API URL"
    description: "Agent sessions. Empty: https://air.api.sandbox.air3.com/v2"
  credential_api_url:
    type: str
    default: ""
    label: "AIR credential API URL"
    description: "verify-by-agent. Empty: https://credential-testnet.api.sandbox.air3.com"
  agent_dir:
    type: str
    default: ""
    label: "Agent key directory"
    description: "Where the agent key and delegation live. Empty: this profile's plugin-data dir."
  mock_air_url:
    type: str
    default: "http://127.0.0.1:8799"
    label: "Mock AIR URL"
    description: "`npm run mock-air` from mocaverse/air-kya, used only for mock-mode sites."
